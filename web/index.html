<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pluie">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="css/icone.svg" type="image/svg+xml">
<title>web_pluie</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="appli">
  <section id="zone-carte" aria-label="Carte des précipitations">
    <div id="carte"></div>
    <div class="pilule" id="etat" role="status">Chargement…</div>
    <div class="lecteur">
      <button id="play" aria-label="Lecture">▶</button>
      <input type="range" id="curseur" min="0" max="0" value="0" aria-label="Heure de l'image">
      <span id="curseur-t">…</span>
    </div>
  </section>

  <main id="panneau">
    <div id="resume" role="status" aria-live="polite">
      <p id="phrase">Recherche de votre position…</p>
      <p id="detail" class="muted"></p>
    </div>
    <div id="sans-gps" class="carte-msg" hidden>
      <p id="sans-gps-texte"></p>
      <button id="b-gps">Réessayer</button>
    </div>

    <figure id="fig-p" class="graphe" hidden>
      <figcaption>Probabilité de pluie sur votre position</figcaption>
      <div class="legende">
        <span><i class="cle" style="--c:var(--s1)"></i>à cette minute</span>
        <span><i class="cle" style="--c:var(--s2)"></i>d'ici là (au moins une fois)</span>
      </div>
      <svg id="courbe" role="img" aria-label="Courbe de probabilité de pluie de 5 à 60 minutes"></svg>
      <div id="bulle" class="bulle" hidden></div>
    </figure>
    <figure id="fig-i" class="graphe" hidden>
      <figcaption>Intensité attendue si la pluie tombe</figcaption>
      <svg id="barres" role="img" aria-label="Intensité de pluie attendue, en millimètres par heure"></svg>
    </figure>
    <details id="tableau-bloc" hidden>
      <summary>Tableau des valeurs</summary>
      <table id="tableau">
        <thead><tr><th>Dans</th><th>À cette minute</th><th>D'ici là</th><th>Intensité</th><th>Radar</th><th>AROME</th></tr></thead>
        <tbody></tbody>
      </table>
    </details>

    <div class="reglages">
      <label><input type="checkbox" id="o-fleches"> Flèches de déplacement</label>
      <label><input type="checkbox" id="o-cellules" checked> Averses fortes suivies</label>
      <label><input type="checkbox" id="o-notifs"> Me prévenir quand la pluie arrive</label>
      <label class="seuil">dès
        <select id="o-seuil" aria-label="Seuil de probabilité">
          <option value="0.3">30 %</option><option value="0.5" selected>50 %</option><option value="0.7">70 %</option><option value="0.9">90 %</option>
        </select>
        de risque d'ici 30 min
      </label>
    </div>
    <p class="sources">Radar <a href="https://www.rainviewer.com">RainViewer</a> · prévision AROME <a href="https://open-meteo.com">Open-Meteo</a> ·
      fond <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a>. Probabilités calculées ici, à partir des images radar :
      une estimation, pas une prévision officielle.</p>
  </main>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
